<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به سیستم - پورتال دانشجویی</title>
   <!--<link rel="stylesheet" href="./wwwroot/css/output.css" />     --> 
    <link rel="stylesheet" href="./wwwroot/css/output.css" />  
       <link rel="stylesheet" href="./wwwroot/css/custom.css" />
    <link href="/wwwroot/fonts/set-font-site.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="./wwwroot/css/animated-background.css" />
    <link rel="stylesheet" href="./wwwroot/libs/ambmodal/ambmodal.css">
</head>
<body class="min-h-screen bg-[var(--bg-secondary)] relative">
    <!-- Animated Background -->
    <div class="animated-bg">
        <!-- Glowing Orbs -->
        <div class="glow bg-primary w-96 h-96 top-[-10%] right-[-5%]"></div>
        <div class="glow bg-accent w-80 h-80 bottom-[-10%] left-[-5%]"></div>
        
        <!-- Floating Shapes -->
        <svg class="shape shape-1 w-20 h-20 top-[10%] right-[15%] text-primary" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
        </svg>
        <svg class="shape shape-2 w-16 h-16 top-[20%] left-[20%] text-accent" fill="currentColor" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="3"/>
        </svg>
        <svg class="shape shape-3 w-24 h-24 bottom-[15%] right-[25%] text-primary" fill="currentColor" viewBox="0 0 24 24">
            <polygon points="12,2 22,20 2,20"/>
        </svg>
        <svg class="shape shape-4 w-14 h-14 top-[60%] right-[10%] text-accent" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <svg class="shape shape-5 w-18 h-18 bottom-[30%] left-[15%] text-primary" fill="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8"/>
        </svg>
        <svg class="shape shape-6 w-20 h-20 top-[40%] left-[30%] text-accent" fill="currentColor" viewBox="0 0 24 24">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-3 sm:p-4">
        <div class="w-full max-w-6xl">
            <div class="grid lg:grid-cols-2 gap-8 items-center">
                <!-- Left Side - Branding (Hidden on Mobile) -->
                <div class="hidden lg:block">
                    <div class="text-center lg:text-right space-y-6">
                        <div class="inline-block p-1">
                                <img src="./wwwroot/imgs/logoazad.png" width="200" >
                        </div>
                        <h1 class="text-5xl font-bold text-[var(--text-secondary)]">سامانه دانا</h1>
                        <div class="space-y-4 pt-6">
                            <div class="flex items-center gap-3 justify-end">
                                <span class="text-[var(--text-secondary)]">دسترسی آسان به کلاس های آنلاین</span>
                                <div class="w-10 h-10 bg-primary-lighter/20 rounded-lg flex items-center justify-center">
                                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 justify-end">
                                <span class="text-[var(--text-secondary)]">برگزاری آزمون ها</span>
                                <div class="w-10 h-10 bg-primary-lighter/20 rounded-lg flex items-center justify-center">
                                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </div>
                            </div>
                  
                        </div>
                    </div>
                </div>

                <!-- Right Side - Login Form -->
                <div class="w-full">
                    <!-- Mobile Header -->
                    <div class="lg:hidden text-center mb-3">
                        <div class="inline-block rounded-xl  mb-1.5 overflow-hidden" style="padding: 2px;">
                            <img src="./wwwroot/imgs/logoazad.png" class="w-20 h-30 object-contain" alt="لوگو دانشگاه آزاد">
                        </div>
                        <p class="text-2xl text-[var(--text-primary)] mt-0.5">سامانه دانا</p>
                    </div>

                    <!-- Login Card -->
                    <div class="bg-[var(--bg-primary)] rounded-2xl shadow-2xl border border-[var(--border-color)] p-5 md:p-6">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xs font-bold text-[var(--text-primary)]">ورود به سیستم</h2>
                            <button id="theme-toggle" class="p-2 rounded-lg hover:bg-[var(--bg-secondary)] transition-colors" aria-label="تغییر تم">
                                <svg class="sun-icon w-5 h-5 text-[var(--text-primary)] hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                                </svg>
                                <svg class="moon-icon w-5 h-5 text-[var(--text-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                                </svg>
                            </button>
                        </div>

                        <form id="login-form" class="space-y-3.5"
                            data-validate
                            data-validate-title="لطفاً خطاهای زیر را برطرف کنید">
                            <!-- Username -->
                            <div>
                                <input type="text" id="username" name="username"
                                    data-rules="required|min:3|max:50|noSpace"
                                    data-label="نام کاربری"
                                    class="w-full px-3 py-2.5 text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="نام کاربری خود را وارد کنید" autocomplete="username">
                            </div>

                            <!-- Password -->
                            <div>
                                <div class="relative">
                                    <input type="password" id="password" name="password"
                                        data-rules="required|min:4"
                                        data-label="رمز عبور"
                                        class="w-full px-3 py-2.5 text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="رمز عبور خود را وارد کنید" autocomplete="current-password">
                                    <button type="button" id="toggle-password"
                                        data-password-toggle
                                        data-password-target="#password"
                                        data-password-icon-show="#eye-open"
                                        data-password-icon-hide="#eye-closed"
                                        class="absolute left-3 top-1/2 transform -translate-y-1/2 text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors p-1" aria-label="نمایش رمز عبور">
                                        <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                        </svg>
                                        <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Captcha -->
                            <div>
                                <div class="flex items-center gap-3">
                                    <!-- تصویر کپچا — attribute-based -->
                                    <div class="flex-shrink-0 relative">
                                        <img
                                            data-captcha-img
                                            data-captcha-mode="test"
                                            data-captcha-token-input="#captcha-input"
                                            data-captcha-loading="#captcha-loading"
                                            data-captcha-error="#captcha-error"
                                            data-captcha-refresh="#refresh-captcha"
                                            id="captcha-img"
                                            src=""
                                            alt="کد امنیتی"
                                            class="rounded-lg border-2 border-[var(--border-color)] transition-all duration-300 hover:border-primary shadow-sm"
                                            style="width:160px; height:42px; object-fit:cover;"
                                            title="کلیک برای تغییر کد"
                                        >
                                        <!-- loading spinner -->
                                        <div id="captcha-loading" class="absolute inset-0 flex items-center justify-center bg-[var(--bg-secondary)] rounded-lg">
                                            <svg class="w-5 h-5 animate-spin text-primary" fill="none" viewBox="0 0 24 24">
                                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                                            </svg>
                                        </div>
                                    </div>

                                <!-- Captcha Input -->
<div class="flex-1 relative">
    <input type="text" id="captcha-input" name="captcha" dir="ltr"
        data-rules="required|captcha:#captcha-img"
        data-label="کد امنیتی"
        class="w-full h-[42px] px-3 text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-center tracking-widest uppercase" 
        placeholder="کد امنیتی را وارد کنید" 
        autocomplete="off" 
        maxlength="6">
    
    <!-- دکمه refresh -->
    <button type="button" id="refresh-captcha" class="absolute -bottom-2 -right-2 w-7 h-7 bg-primary text-white rounded-full shadow-lg hover:bg-primary-dark transition-all duration-200 flex items-center justify-center hover:scale-110 z-20" aria-label="تولید کد جدید">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
    </button>
</div>
                                </div>
                            </div>

                            <!-- Role Selection -->
                            <div>
                                <label class="block text-sm font-medium text-[var(--text-primary)] mb-2">انتخاب نقش کاربری</label>
                           <div class="grid grid-cols-2 gap-2">
    <label class="cursor-pointer">
        <input type="radio" name="role" value="student" class="peer sr-only" checked required>
        <div class="flex flex-col items-center gap-1 p-2 rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] peer-checked:border-2 peer-checked:border-primary peer-checked:bg-primary-lighter/20 hover:border-primary/50">
            <svg class="w-7 h-7 text-[var(--text-secondary)] peer-checked:text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
            </svg>
            <span class="text-sm font-medium text-[var(--text-primary)]">دانشجو</span>
        </div>
    </label>
    <label class="cursor-pointer">
        <input type="radio" name="role" value="professor" class="peer sr-only" required>
        <div class="flex flex-col items-center gap-1 p-2 rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] peer-checked:border-2 peer-checked:border-primary peer-checked:bg-primary-lighter/20 hover:border-primary/50">
            <svg class="w-7 h-7 text-[var(--text-secondary)] peer-checked:text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span class="text-sm font-medium text-[var(--text-primary)]">استاد</span>
        </div>
    </label>
</div>
                            </div>

                            <!-- Remember & Forgot -->
                            <div class="flex items-center justify-between">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="remember" name="remember" class="w-4 h-4 text-primary border-[var(--border-color)] rounded focus:ring-2 focus:ring-primary">
                                    <span class="text-sm text-[var(--text-secondary)]">مرا به خاطر بسپار</span>
                                </label>
                                <a href="./forget-password.html" class="text-sm text-primary hover:text-primary-dark transition-colors font-medium">فراموشی رمز عبور</a>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="w-full bg-primary text-white py-2.5 rounded-lg text-sm font-medium hover:bg-primary-dark transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                ورود به سیستم
                            </button>

                        </form>
                        <!-- Info Alert - نسخه نهایی با اصلاحات واقعی -->
<div class="bg-[var(--color-primary-lighter)]/40 border border-[var(--color-primary)]/20 rounded-xl overflow-hidden mt-4 mb-4">
    
    <!-- بخش عنوان -->
    <div class="flex items-center gap-2 px-3 py-2.5 border-b border-[var(--color-warning)]/15">
        <div class="w-1 h-4 rounded-full shrink-0" style="background-color: var(--color-warning);"></div>
        <svg class="w-3.5 h-3.5 shrink-0" style="color: var(--color-warning);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-sm font-semibold" style="color: var(--color-warning);">راهنمای ورود به سامانه</span>
    </div>
         
<!-- بخش اساتید و دانشجویان -->
<div class="flex gap-1">
    <!-- اساتید -->
    <div class="flex-1 p-2 space-y-1.5">
        <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 shrink-0" style="color: var(--color-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="font-semibold text-xs" style="color: var(--color-primary);">اساتید</span>
        </div>
        <div class="space-y-1">
            <div class="flex items-center justify-between gap-1">
                <span class="font-medium text-xs text-[var(--text-primary)]">نام کاربری:</span>
                <span dir="ltr" class="text-xs text-[var(--text-secondary)] truncate">کدملی@edu</span>
            </div>
            <div class="flex items-center justify-between gap-1">
                <span class="font-medium text-xs text-[var(--text-primary)]">رمز عبور:</span>
                <span class="text-xs text-[var(--text-secondary)]">کد ملی</span>
            </div>
        </div>
    </div>

    <!-- جداکننده -->
    <div class="flex flex-col items-center justify-center gap-1 px-1">
        <div class="w-px h-6 bg-[var(--border-color)] rounded-full"></div>
        <svg class="w-4 h-4 text-yellow-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <div class="w-px h-6 bg-[var(--border-color)] rounded-full"></div>
    </div>

    <!-- دانشجویان -->
    <div class="flex-1 p-2 space-y-1.5">
        <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 shrink-0" style="color: var(--color-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
            </svg>
            <span class="font-semibold text-xs" style="color: var(--color-primary);">دانشجویان</span>
        </div>
        <div class="space-y-1">
            <div class="flex items-center justify-between gap-1">
                <span class="font-medium text-xs text-[var(--text-primary)]">نام کاربری:</span>
                <span class="text-xs text-[var(--text-secondary)] truncate">ش. دانشجویی</span>
            </div>
            <div class="flex items-center justify-between gap-1">
                <span class="font-medium text-xs text-[var(--text-primary)]">رمز عبور:</span>
                <span class="text-xs text-[var(--text-secondary)] truncate">ش. دانشجویی</span>
            </div>
        </div>
    </div>
</div>
    <!-- بخش نکته ویژه + دانلود -->
    <div class="flex items-center justify-between flex-wrap gap-1.5 px-3 py-2 border-t border-[var(--color-primary)]/15">
        <div class="flex items-center gap-1 flex-wrap">
            <svg class="w-3.5 h-3.5 shrink-0" style="color: var(--color-warning);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span class="text-[10px] font-medium" style="color: var(--color-warning);">ورودی‌های قبل از 99:</span>
            <span class="text-[10px] text-[var(--text-secondary)]">ش. دانشجویی + ۳ رقم اول کد واحد</span>
        </div>
        <a href="#" class="flex items-center gap-1 transition-colors rounded-md px-2 py-0.5 shrink-0" style="color: var(--color-primary); background-color: var(--color-primary-lighter);">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            <span class="text-[10px] font-medium">دانلود راهنما</span>
        </a>
    </div>
</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./wwwroot/js/shared/utils.js"></script>
    <script src="./wwwroot/js/shared/theme.js"></script>
    <!-- Captcha Module — auto-init via data attributes -->
    <script src="./wwwroot/js/captcha-module/captcha.js"></script>
    <!-- Password Toggle Module — auto-init via data attributes -->
    <script src="./wwwroot/js/password-toggle-module/password-toggle.js"></script>
    <!-- Notification Modal Module -->
    <script src="./wwwroot/libs/ambmodal/ambmodal.js"></script>
    <!-- Form Validator Module — auto-init via data-validate -->
    <script src="./wwwroot/js/form-validator-module/form-validator.js"></script>
    <script>
        // Form Submit Handler
        // Runs only after FormValidator passes all data-rules.
        // FormValidator is loaded above and intercepts submit first;
        // on success it dispatches a custom 'fv:valid' event on the form.
        document.getElementById('login-form').addEventListener('fv:valid', function() {
            const username = document.getElementById('username').value;
            const role = document.querySelector('input[name="role"]:checked')?.value;

            console.log('Login attempt:', { username, role });
            window.location.href = './courses.html';
        });
    </script>
</body>
</html>
