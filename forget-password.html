<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فراموشی رمز عبور - پورتال دانشجویی</title>
    
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./wwwroot/css/output.css" />
    <link href="/wwwroot/fonts/set-font-site.css" rel="stylesheet" type="text/css" />
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
        .float-animation {
            animation: float 6s ease-in-out infinite;
        }
        .pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-blue-50 via-white to-teal-50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900">
    <!-- Animated Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 right-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl float-animation"></div>
        <div class="absolute bottom-20 left-20 w-80 h-80 bg-secondary/10 rounded-full blur-3xl float-animation" style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 w-96 h-96 bg-accent/5 rounded-full blur-3xl pulse-glow"></div>
        
        <svg class="absolute inset-0 w-full h-full opacity-30" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <circle cx="20" cy="20" r="1" fill="currentColor" class="text-primary/20"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
        </svg>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md px-4 py-6 relative z-10">
        <!-- Card -->
        <div class="bg-[var(--bg-primary)]/95 backdrop-blur-sm rounded-2xl shadow-2xl border border-[var(--border-color)] overflow-hidden">
            <!-- Header -->
            <div class="bg-primary p-6 text-center">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                    <svg class="w-10 h-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-white mb-1">بازیابی رمز عبور</h1>
                <p class="text-white/90 text-xs">دانشگاه علوم پزشکی</p>
            </div>

            <!-- Form Section -->
            <div class="p-6">
                <!-- Step 1: Enter Mobile/Email -->
                <div id="step1" class="space-y-4">
                    <div class="text-center mb-4">
                        <p class="text-sm text-[var(--text-secondary)]">
                            شماره موبایل یا ایمیل خود را وارد کنید
                        </p>
                    </div>

                    <form id="forget-form-step1" class="space-y-3.5">
                        <!-- Mobile/Email Input -->
                        <div>
                            <label for="contact" class="block text-xs font-medium text-[var(--text-primary)] mb-1.5">
                                شماره موبایل یا ایمیل <span class="text-red-500">*</span>
                            </label>
                            <div class="relative">
                                <input type="text" 
                                       id="contact" 
                                       name="contact"
                                       class="w-full px-3 py-2 pr-9 text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-primary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="09123456789 یا email@example.com"
                                       required
                                       aria-required="true">
                                <svg class="w-4 h-4 absolute right-3 top-1/2 transform -translate-y-1/2 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" 
                                class="w-full bg-primary text-white py-2.5 rounded-lg font-medium hover:bg-primary-dark transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-lg hover:shadow-xl text-sm">
                            ارسال کد تایید
                        </button>
                    </form>
                </div>

                <!-- Step 2: Enter Code -->
                <div id="step2" class="space-y-4 hidden">
                    <div class="text-center mb-4">
                        <p class="text-sm text-[var(--text-secondary)]">
                            کد تایید ارسال شده را وارد کنید
                        </p>
                        <p class="text-xs text-accent mt-1" id="contact-display"></p>
                    </div>

                    <form id="forget-form-step2" class="space-y-3.5">
                        <!-- Verification Code -->
                        <div>
                            <label for="code" class="block text-xs font-medium text-[var(--text-primary)] mb-1.5">
                                کد تایید <span class="text-red-500">*</span>
                            </label>
                            <input type="text" 
                                   id="code" 
                                   name="code"
                                   maxlength="6"
                                   class="w-full px-3 py-2 text-sm text-center rounded-lg border border-[var(--border-color)] bg-[var(--bg-primary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent tracking-widest"
                                   placeholder="۱۲۳۴۵۶"
                                   required
                                   aria-required="true">
                        </div>

                        <!-- Resend Code -->
                        <div class="text-center">
                            <button type="button" id="resend-code" class="text-xs text-primary hover:text-primary-light transition-colors">
                                ارسال مجدد کد
                            </button>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" 
                                class="w-full bg-primary text-white py-2.5 rounded-lg font-medium hover:bg-primary-dark transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-lg hover:shadow-xl text-sm">
                            تایید کد
                        </button>
                    </form>
                </div>

                <!-- Step 3: Reset Password -->
                <div id="step3" class="space-y-4 hidden">
                    <div class="text-center mb-4">
                        <p class="text-sm text-[var(--text-secondary)]">
                            رمز عبور جدید خود را وارد کنید
                        </p>
                    </div>

                    <form id="forget-form-step3" class="space-y-3.5">
                        <!-- New Password -->
                        <div>
                            <label for="new-password" class="block text-xs font-medium text-[var(--text-primary)] mb-1.5">
                                رمز عبور جدید <span class="text-red-500">*</span>
                            </label>
                            <div class="relative">
                                <input type="password" 
                                       id="new-password" 
                                       name="new-password"
                                       class="w-full px-3 py-2 pr-9 text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-primary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="حداقل ۸ کاراکتر"
                                       required
                                       minlength="8"
                                       aria-required="true">
                                <svg class="w-4 h-4 absolute right-3 top-1/2 transform -translate-y-1/2 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div>
                            <label for="confirm-password" class="block text-xs font-medium text-[var(--text-primary)] mb-1.5">
                                تکرار رمز عبور <span class="text-red-500">*</span>
                            </label>
                            <div class="relative">
                                <input type="password" 
                                       id="confirm-password" 
                                       name="confirm-password"
                                       class="w-full px-3 py-2 pr-9 text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-primary)] text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                                       placeholder="تکرار رمز عبور جدید"
                                       required
                                       minlength="8"
                                       aria-required="true">
                                <svg class="w-4 h-4 absolute right-3 top-1/2 transform -translate-y-1/2 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" 
                                class="w-full bg-primary text-white py-2.5 rounded-lg font-medium hover:bg-primary-dark transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 shadow-lg hover:shadow-xl text-sm">
                            تغییر رمز عبور
                        </button>
                    </form>
                </div>

                <!-- Back to Login -->
                <div class="mt-4 pt-4 border-t border-[var(--border-color)] text-center">
                    <a href="./login.html" class="text-xs text-[var(--text-secondary)] hover:text-primary transition-colors">
                        <span class="flex items-center justify-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                            بازگشت به صفحه ورود
                        </span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Theme Toggle -->
        <div class="mt-4 flex justify-center">
            <button id="theme-toggle" 
                    class="p-2.5 rounded-full bg-[var(--bg-primary)]/95 backdrop-blur-sm border border-[var(--border-color)] shadow-lg hover:shadow-xl transition-all focus-visible-ring"
                    aria-label="تغییر تم">
                <svg class="sun-icon w-5 h-5 text-[var(--text-primary)] hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg class="moon-icon w-5 h-5 text-[var(--text-primary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./wwwroot/js/shared/utils.js"></script>
    <script src="./wwwroot/js/shared/theme.js"></script>
    <script>
        let userContact = '';

        // Step 1: Send verification code
        document.getElementById('forget-form-step1').addEventListener('submit', function(e) {
            e.preventDefault();
            userContact = document.getElementById('contact').value;
            
            // Simulate sending code
            console.log('Sending code to:', userContact);
            
            // Show step 2
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('contact-display').textContent = userContact;
        });

        // Resend code
        document.getElementById('resend-code').addEventListener('click', function() {
            console.log('Resending code to:', userContact);
            alert('کد تایید مجدداً ارسال شد');
        });

        // Step 2: Verify code
        document.getElementById('forget-form-step2').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('code').value;
            
            // Simulate code verification
            console.log('Verifying code:', code);
            
            // Show step 3
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        });

        // Step 3: Reset password
        document.getElementById('forget-form-step3').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                alert('رمز عبور و تکرار آن یکسان نیستند');
                return;
            }
            
            // Simulate password reset
            console.log('Password reset successful');
            alert('رمز عبور با موفقیت تغییر یافت');
            window.location.href = './login.html';
        });
    </script>
</body>
</html>
